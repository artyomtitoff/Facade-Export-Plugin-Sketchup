<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экспорт фасадов — автоматический вывод (превью)</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #dcdfe4;
    --text: #23272e;
    --muted: #6b7280;
    --accent: #1f6feb;
    --accent-dark: #1857bd;
    --wall: #e03131;
    --wall-off: #b9c1cc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    flex: 0 0 auto;
    padding: 12px 18px 11px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 3px 0; font-size: 15px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }

  main {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: 14px; align-items: stretch;
    padding: 12px 18px 14px 18px;
  }

  /* Слева — схема здания сверху. */
  .plan-pane {
    flex: 0 0 auto; width: 46%; min-width: 280px;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px;
  }
  .plan-pane .canvas { flex: 1 1 auto; min-height: 0; }
  .plan-pane .canvas svg { width: 100%; height: 100%; display: block; }
  .plan-pane .caption { font-size: 11px; color: var(--muted); text-align: center; }

  /* Справа — компактный список фасадов. */
  .list-pane {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden;
  }
  .list-pane .head, .facade {
    display: grid;
    grid-template-columns: 44px minmax(90px, 1fr) 104px 96px;
    gap: 8px; align-items: center;
  }
  .list-pane .head {
    padding: 7px 10px; border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--muted);
  }
  .list-pane .rows { flex: 1 1 auto; overflow-y: auto; }

  .facade { padding: 7px 10px; border-bottom: 1px solid #eef0f3; cursor: pointer; }
  .facade.off { opacity: .5; }
  .badge {
    width: 26px; height: 26px; line-height: 24px; border-radius: 13px;
    text-align: center; font-size: 12px; font-weight: 600;
    border: 2px solid var(--wall); background: var(--wall); color: #fff;
  }
  .facade.off .badge { border-color: var(--wall-off); background: #fff; color: var(--muted); }
  input[type="text"], select {
    font: inherit; padding: 4px 6px; border: 1px solid var(--line);
    border-radius: 5px; background: #fff; color: var(--text); width: 100%;
  }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }
  .px { color: var(--muted); font-size: 11px; text-align: right; }

  footer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; background: var(--panel); border-top: 1px solid var(--line);
  }
  footer .spacer { flex: 1 1 auto; }
  footer .hint { max-width: 520px; color: var(--muted); font-size: 11.5px; }
  footer button {
    padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--text); font: inherit; cursor: pointer;
  }
  footer button:hover { background: #f0f2f5; }
  footer button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  footer button.primary:hover { background: var(--accent-dark); }

  .wall-hit { cursor: pointer; }
  .badge-g { cursor: pointer; }
</style>
</head>

    },
    {
      "index": 8,
      "compass": "двор",
      "name": "Фасад 8",
      "pageName": "Фасад 8 — двор",
      "aspect": "3:4",
      "selected": true,
      "segment": {
        "from": [
          380,
          380
        ],
        "to": [
          620,
          380
        ],
        "normal": [
          0,
          1
        ],
        "area": 720
      }
    }
  ]
};</script>
<div style="background:#fff8e1;border-bottom:1px solid #f0d48a;padding:8px 18px;font:13px/1.4 sans-serif;color:#6b5b1f">Демонстрационная страница окна «Автоматический вывод фасада» плагина «Экспорт фасадов». В SketchUp это же окно открывается кнопкой <b>Автоматический вывод фасада</b>.</div>

<header>
  <h1>Автоматический вывод фасада</h1>
  <p id="subtitle">Анализ модели…</p>
</header>

<main>
  <section class="plan-pane">
    <div class="canvas" id="canvas"></div>
    <div class="caption">Схема сверху — условная: только контур здания, без деталей.</div>
  </section>
  <section class="list-pane">
    <div class="head">
      <div>№</div><div>Имя фасада</div><div>Стороны</div><div>Размер</div>
    </div>
    <div class="rows" id="rows"></div>
  </section>
</main>

<footer>
  <span class="hint" id="footnote"></span>
  <span class="spacer"></span>
  <button id="btn-cancel" type="button">Отмена</button>
  <button id="btn-export" class="primary" type="button">Экспортировать</button>
</footer>

<script>
(function () {
  "use strict";

  var data = null;
  var state = [];

  /* ------------------------------------------------------------ утилиты */

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function round(v) { return Math.round(v); }

  // Размер PNG по соотношению: длинная сторона — из настроек экспорта.
  function pixels(aspect, longest) {
    var parts = String(aspect).split(':');
    var a = Number(parts[0]) || 1;
    var b = Number(parts[1]) || 1;
    if (a >= b) return [longest, Math.max(100, round(longest * b / a))];
    return [Math.max(100, round(longest * a / b)), longest];
  }

  /* ------------------------------------------------ схема сверху «жучок» */

  // Единственная схема на всё окно: серый контур здания (сетка занятых
  // клеток, внутренний двор остаётся пустым) и красные линии стен — по одной
  // на найденный фасад. Клик по стене или по её номеру включает/выключает
  // фасад. Никаких превью фасадов — окно должно открываться мгновенно.
  function planSvg() {
    var plan = (data && data.plan) || {};
    var cells = plan.cells || [];
    var grid = Number(plan.grid) || 40;
    var cell = 1000 / grid;
    var svg = [];
    svg.push('<svg viewBox="-70 -70 1140 1140" preserveAspectRatio="xMidYMid meet">');
    svg.push('<rect x="-70" y="-70" width="1140" height="1140" fill="#ffffff"/>');

    // Контур здания: каждая клетка — небольшой квадрат с общей обводкой.
    cells.forEach(function (c) {
      svg.push('<rect x="' + round(c[0] * cell) + '" y="' + round(c[1] * cell) +
               '" width="' + round(cell + 0.8) + '" height="' + round(cell + 0.8) +
               '" fill="#e6e9ee" stroke="#ccd3dc" stroke-width="2"/>');
    });

    // Номера не должны наезжать друг на друга: у внутренних фасадов двора
    // они оказываются рядом. Место под номер подбирается по очереди —
    // сначала снаружи от стены, потом со сдвигом вдоль стены.
    var placed = [];
    function badgeSpot(mx, my, nx, ny) {
      var base = 120;
      var gapLimit = 84;
      var tx = -ny;
      var ty = nx;
      for (var d = 0; d < 3; d++) {
        for (var l = 0; l < 3; l++) {
          var shift = l === 0 ? 0 : (l === 1 ? 96 : -96);
          var cx = mx + nx * (base + d * 74) + tx * shift;
          var cy = my + ny * (base + d * 74) + ty * shift;
          var clash = placed.some(function (p) {
            return Math.sqrt((p[0] - cx) * (p[0] - cx) + (p[1] - cy) * (p[1] - cy)) < gapLimit;
          });
          if (!clash) {
            placed.push([cx, cy]);
            return [cx, cy];
          }
        }
      }
      var fx = mx + nx * base;
      var fy = my + ny * base;
      placed.push([fx, fy]);
      return [fx, fy];
    }

    state.forEach(function (item, i) {
      var seg = item.segment;
      if (!seg || !seg.from || !seg.to) return;
      var a = seg.from, b = seg.to;
      var nx = seg.normal ? seg.normal[0] : 0;
      var ny = seg.normal ? seg.normal[1] : 1;   // уже в координатах SVG
      var mx = (a[0] + b[0]) / 2;
      var my = (a[1] + b[1]) / 2;
      var color = item.selected ? '#e03131' : '#b9c1cc';
      var width = item.selected ? 22 : 14;
      var offset = 62;

      // Сама стена.
      svg.push('<line x1="' + round(a[0]) + '" y1="' + round(a[1]) + '" x2="' + round(b[0]) +
               '" y2="' + round(b[1]) + '" stroke="' + color + '" stroke-width="' + width +
               '" stroke-linecap="round"/>');
      // Носик наружу: короткая стрелка от середины стены.
      var ax = mx + nx * (offset * 0.55);
      var ay = my + ny * (offset * 0.55);
      var bx = mx + nx * offset;
      var by = my + ny * offset;
      svg.push('<line x1="' + round(ax) + '" y1="' + round(ay) + '" x2="' + round(bx) +
               '" y2="' + round(by) + '" stroke="' + color + '" stroke-width="' +
               (item.selected ? 11 : 8) + '" stroke-linecap="round"/>');
      svg.push('<circle cx="' + round(bx) + '" cy="' + round(by) + '" r="' +
               (item.selected ? 9 : 7) + '" fill="' + color + '"/>');

      // Номер фасада — снаружи от стены.
      var spot = badgeSpot(mx, my, nx, ny);
      var cx = spot[0];
      var cy = spot[1];
      svg.push('<circle cx="' + round(cx) + '" cy="' + round(cy) + '" r="36" ' +
               'fill="' + (item.selected ? '#e03131' : '#ffffff') + '" ' +
               'stroke="' + (item.selected ? '#e03131' : '#b9c1cc') + '" stroke-width="6"/>');
      svg.push('<text x="' + round(cx) + '" y="' + round(cy) + '" text-anchor="middle" ' +
               'dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" ' +
               'font-size="42" font-weight="600" ' +
               'fill="' + (item.selected ? '#ffffff' : '#9aa3b0') + '">' +
               esc(item.index) + '</text>');

      // Кликабельные области: стена (широкая прозрачная линия) и номер.
      svg.push('<line class="wall-hit" data-index="' + i + '" x1="' + round(a[0]) +
               '" y1="' + round(a[1]) + '" x2="' + round(b[0]) + '" y2="' + round(b[1]) +
               '" stroke="transparent" stroke-width="46" stroke-linecap="round"/>');
      svg.push('<circle class="badge-g" data-index="' + i + '" cx="' + round(cx) +
               '" cy="' + round(cy) + '" r="46" fill="transparent"/>');
    });

    svg.push('</svg>');
    return svg.join('');
  }

  function renderPlan() {
    document.getElementById('canvas').innerHTML = planSvg();
    document.querySelectorAll('.wall-hit, .badge-g').forEach(function (node) {
      node.addEventListener('click', function () {
        toggle(Number(node.getAttribute('data-index')));
      });
    });
  }

  /* --------------------------------------------------- список фасадов */

  function renderRows() {
    var html = '';
    state.forEach(function (item, i) {
      var px = pixels(item.aspect, data.longestSide);
      html += '<div class="facade' + (item.selected ? '' : ' off') + '" data-index="' + i + '">';
      html += '<div><div class="badge" data-role="toggle">' + esc(item.index) + '</div></div>';
      html += '<div><input type="text" data-role="name" maxlength="60" value="' +
              esc(item.name) + '"></div>';
      html += '<div><select data-role="aspect">' + aspectOptions(item.aspect) + '</select></div>';
      html += '<div class="px" data-role="px">' + px[0] + '×' + px[1] + '</div>';
      html += '</div>';
    });
    document.getElementById('rows').innerHTML = html;

    document.querySelectorAll('.facade').forEach(function (row) {
      var index = Number(row.getAttribute('data-index'));
      var item = state[index];
      row.querySelector('[data-role="toggle"]').addEventListener('click', function (e) {
        e.stopPropagation();
        toggle(index);
      });
      row.querySelector('[data-role="name"]').addEventListener('input', function (e) {
        item.name = e.target.value;
      });
      row.querySelector('[data-role="name"]').addEventListener('click', function (e) {
        e.stopPropagation();
      });
      row.querySelector('[data-role="aspect"]').addEventListener('click', function (e) {
        e.stopPropagation();
      });
      row.querySelector('[data-role="aspect"]').addEventListener('change', function (e) {
        item.aspect = e.target.value;
        var size = pixels(item.aspect, data.longestSide);
        row.querySelector('[data-role="px"]').textContent = size[0] + '×' + size[1];
      });
      row.addEventListener('click', function () { toggle(index); });
    });
  }

  function aspectOptions(current) {
    var html = '';
    (data.aspects || []).forEach(function (pair) {
      var value = pair[0];
      var label = pair[1];
      html += '<option value="' + esc(value) + '"' +
              (value === current ? ' selected' : '') + '>' + esc(label) + '</option>';
    });
    return html;
  }

  // Включение/выключение фасада: перерисовываются и схема, и список.
  function toggle(index) {
    var item = state[index];
    if (!item) return;
    item.selected = !item.selected;
    renderPlan();
    var row = document.querySelector('.facade[data-index="' + index + '"]');
    if (row) row.classList.toggle('off', !item.selected);
    updateFootnote();
  }

  function render() {
    if (!data || !state.length) {
      document.getElementById('canvas').innerHTML =
        '<div style="padding:40px;text-align:center;color:#6b7280">Схема недоступна.</div>';
      document.getElementById('rows').innerHTML = '';
      document.getElementById('footnote').textContent = 'Фасады не найдены.';
      return;
    }
    renderPlan();
    renderRows();
    updateFootnote();
  }

  function updateFootnote() {
    var chosen = state.filter(function (s) { return s.selected; }).length;
    var parts = ['Выбрано: ' + chosen + ' из ' + state.length + '.'];
    if (data && data.cutSections === false) parts.push('Секущие плоскости отключены.');
    parts.push(data && data.deleteScenes ? 'Сцены временные.' : 'Сцены останутся в модели.');
    document.getElementById('footnote').textContent = parts.join(' ');
  }

  /* -------------------------------------------------------- API для Ruby */

  window.FacadeExportAuto = {
    setData: function (json) {
      try {
        data = JSON.parse(json);
      } catch (e) {
        data = null;
      }
      if (!data) return;
      state = (data.facades || []).map(function (f) {
        return {
          index: f.index,
          selected: f.selected !== false,
          name: f.name || ('Фасад ' + f.index),
          aspect: f.aspect || data.defaultAspect || '3:4',
          segment: f.segment || null
        };
      });
      document.getElementById('subtitle').textContent =
        'Найдено фасадов: ' + state.length + ' — ' +
        (data.scope === 'context' ? 'открытая группа' : 'вся модель') +
        '. Нажмите на стену на схеме, чтобы включить или выключить фасад.';
      render();
    }
  };

  function inSketchUp() {
    return !!(window.sketchup && typeof sketchup.ready === 'function');
  }

  function collect() {
    return {
      facades: state.map(function (item) {
        return {
          index: item.index,
          selected: !!item.selected,
          name: item.name,
          aspect: item.aspect
        };
      })
    };
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('btn-export').addEventListener('click', function () {
      if (!state.some(function (s) { return s.selected; })) {
        document.getElementById('footnote').textContent = 'Отметьте хотя бы один фасад.';
        return;
      }
      if (inSketchUp()) sketchup.export(JSON.stringify(collect()));
      else window.close();
    });
    document.getElementById('btn-cancel').addEventListener('click', function () {
      if (inSketchUp()) sketchup.cancel();
      else window.close();
    });

    if (inSketchUp()) {
      sketchup.ready();
    } else if (window.FACADE_EXPORT_AUTO_DEMO) {
      // Демо-страница (docs/auto_preview.html) — вне SketchUp.
      window.FacadeExportAuto.setData(JSON.stringify(window.FACADE_EXPORT_AUTO_DEMO));
      document.getElementById('btn-export').textContent = 'Экспортировать (демо)';
    }
  });
})();
</script>
</body>
</html>
