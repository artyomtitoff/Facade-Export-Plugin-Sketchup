<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экспорт фасадов — автоматический вывод</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #dcdfe4;
    --text: #23272e;
    --muted: #6b7280;
    --accent: #1f6feb;
    --accent-dark: #1857bd;
    --wall: #e03131;
    --wall-off: #b9c1cc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    flex: 0 0 auto;
    padding: 10px 16px 9px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 2px 0; font-size: 15px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }

  main {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: 12px; align-items: stretch;
    padding: 10px 16px 12px 16px;
  }

  /* Слева — схема здания сверху. */
  .plan-pane {
    flex: 0 0 auto; width: 46%; min-width: 280px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px;
  }
  .plan-pane .canvas { flex: 1 1 auto; min-height: 0; position: relative; }
  .plan-pane .canvas svg {
    width: 100%; height: 100%; display: block;
    touch-action: none; cursor: crosshair;
    -webkit-user-select: none; user-select: none;
  }
  .plan-pane .canvas.draggable svg { cursor: grab; }
  .plan-pane .canvas.grabbing svg { cursor: grabbing; }
  .plan-pane .caption { font-size: 11px; color: var(--muted); text-align: center; }

  /* Справа — компактный список нарисованных фасадов. */
  .list-pane {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden;
  }
  .list-pane .head, .facade {
    display: grid;
    grid-template-columns: 26px minmax(62px, 1fr) 104px 78px 74px 20px 20px;
    gap: 6px; align-items: center;
  }
  .list-pane .head {
    padding: 6px 10px; border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--muted);
  }
  .list-pane .rows { flex: 1 1 auto; overflow-y: auto; }
  .list-pane .empty {
    padding: 18px 14px; color: var(--muted); font-size: 12.5px;
  }

  .facade { padding: 5px 10px; border-bottom: 1px solid #eef0f3; }
  .facade.off { opacity: .5; }
  .badge {
    width: 20px; height: 20px; line-height: 16px; border-radius: 10px;
    text-align: center; font-size: 11px; font-weight: 600;
    border: 2px solid var(--wall); background: var(--wall); color: #fff;
    cursor: pointer;
  }
  .facade.off .badge { border-color: var(--wall-off); background: #fff; color: var(--muted); }
  input[type="text"], select {
    font: inherit; padding: 3px 6px; border: 1px solid var(--line);
    border-radius: 5px; background: #fff; color: var(--text); width: 100%;
  }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }
  .px { color: var(--muted); font-size: 11px; text-align: right; }
  .remove, .flip {
    border: 0; background: transparent; color: var(--muted); font-size: 14px;
    cursor: pointer; padding: 0; line-height: 1;
  }
  .remove:hover { color: #c0392b; }
  .flip:hover { color: var(--accent); }

  footer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line);
  }
  footer .spacer { flex: 1 1 auto; }
  footer .hint { max-width: 620px; color: var(--muted); font-size: 11.5px; }
  footer button {
    padding: 6px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--text); font: inherit; cursor: pointer;
  }
  footer button:hover { background: #f0f2f5; }
  footer button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  footer button.primary:hover { background: var(--accent-dark); }
</style>
</head>
<body>

<header>
  <h1>Автоматический вывод фасада</h1>
  <p id="subtitle">Анализ модели…</p>
</header>

<main>
  <section class="plan-pane">
    <div class="canvas" id="canvas"></div>
    <div class="caption">Проведите линию — по ней пойдёт фасад. Тяните линию, чтобы
      передвинуть. Клик по линии или номеру — включить/выключить.</div>
  </section>
  <section class="list-pane">
    <div class="head">
      <div>№</div><div>Имя фасада</div><div>Ориентация</div><div>Пропорции</div>
      <div>Размер</div><div title="Развернуть фасад">⇄</div><div></div>
    </div>
    <div class="rows" id="rows"></div>
  </section>
</main>

<footer>
  <span class="hint" id="footnote"></span>
  <span class="spacer"></span>
  <button id="btn-cancel" type="button">Отмена</button>
  <button id="btn-export" class="primary" type="button">Экспортировать</button>
</footer>

<script>
(function () {
  "use strict";

  var data = null;
  var state = [];        // нарисованные фасады, порядок = порядок строк
  var drag = null;       // [x1, y1, x2, y2] — линия, которую ведут мышью
  var moving = null;     // { item: ..., start: [x, y], segment: {...} }

  /* ------------------------------------------------------------ утилиты */

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function round(v) { return Math.round(v); }

  function grid() { return Number((data && data.plan && data.plan.grid) || 40); }
  function cells() { return (data && data.plan && data.plan.cells) || []; }
  function polygons() { return (data && data.plan && data.plan.polygons) || []; }
  function longest() { return Number((data && data.longestSide) || 9999); }
  // Пропорции — свои для каждой ориентации: горизонтальному кадру только
  // широкие пары, вертикальному — только высокие, квадрату — одна 1:1.
  function ratiosFor(orient) {
    var all = (data && data.ratios) || {};
    var list = all[orient] || all.h || [];
    return list.length ? list : [['4:3', '4:3']];
  }
  function defaultRatio(orient) {
    var list = ratiosFor(orient);
    return list.length ? list[0][0] : '4:3';
  }

  // Точка внутри многоугольника (алгоритм луча).
  function inPolygon(x, y, points) {
    var inside = false;
    var j = points.length - 1;
    for (var i = 0; i < points.length; i++) {
      var xi = points[i][0], yi = points[i][1];
      var xj = points[j][0], yj = points[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
        inside = !inside;
      }
      j = i;
    }
    return inside;
  }

  // Пара пропорций, приведённая к ориентации: горизонтальному кадру только
  // широкие пары, вертикальному — только высокие, квадрату — 1:1.
  function fittedRatio(orient, ratio) {
    var keys = ratiosFor(orient).map(function (pair) { return pair[0]; });
    if (orient === 'sq') return keys[0] || '1:1';
    if (keys.indexOf(ratio) >= 0) return ratio;
    var parts = String(ratio || '').split(':');
    var a = Number(parts[0]) || 0;
    var b = Number(parts[1]) || 0;
    if (!a || !b) return keys[0] || (orient === 'v' ? '3:4' : '4:3');
    var wantsVertical = orient === 'v';
    var isVertical = a < b;
    var swapped = isVertical === wantsVertical ? ratio : b + ':' + a;
    return keys.indexOf(swapped) >= 0 ? swapped : (keys[0] || swapped);
  }

  // Размер PNG: длинная сторона — из настроек экспорта, вторая — по паре
  // пропорций своей ориентации (16:9 у горизонтального, 9:16 у вертикального).
  function pixels(orient, ratio) {
    var longestSide = longest();
    if (orient === 'sq') return [longestSide, longestSide];
    var parts = fittedRatio(orient, ratio).split(':');
    var a = Number(parts[0]) || 4;
    var b = Number(parts[1]) || 3;
    var wide = a >= b;
    var edge = Math.max(100, Math.round(wide ? longestSide * b / a : longestSide * a / b));
    if (orient === 'v') return [edge, longestSide];
    return [longestSide, edge];
  }

  function sizeText(item) {
    var px = pixels(item.orient, item.ratio);
    return px ? (px[0] + '×' + px[1]) : 'по фасаду';
  }

  function itemAt(position) { return state[position]; }

  function visibleItems() {
    return state.filter(function (item) { return !item.removed; });
  }

  /* ------------------------------------------------ схема сверху «жучок» */

  // Точка внутри контура здания (по клеткам схемы, ось Y перевёрнута).
  function insideBuilding(x, y) {
    var faces = polygons();
    if (faces.length) {
      for (var i = 0; i < faces.length; i++) {
        if (inPolygon(x, y, faces[i])) return true;
      }
      return false;
    }
    var cell = 1000 / grid();
    var ix = Math.floor(x / cell);
    var iy = Math.floor(y / cell);
    var list = cells();
    for (var j = 0; j < list.length; j++) {
      if (list[j][0] === ix && list[j][1] === iy) return true;
    }
    return false;
  }

  // Стрелка стоит со стороны камеры (туда же смотрит нормаль фасада) и
  // смотрит НА линию: носок треугольника почти касается линии, основание —
  // дальше от неё. Камера этого фасада смотрит туда же, куда стрелка.
  function arrowMark(seg, color) {
    var cx = (seg.from[0] + seg.to[0]) / 2;
    var cy = (seg.from[1] + seg.to[1]) / 2;
    var nx = seg.normal[0];       // от линии в сторону камеры
    var ny = seg.normal[1];
    var gap = 8;                  // носок почти касается линии
    var head = 30;                // высота треугольника
    var half = 15;                // половина основания
    var tx = -ny;
    var ty = nx;
    var tipX = cx + nx * gap;
    var tipY = cy + ny * gap;
    var baseX = tipX + nx * head;
    var baseY = tipY + ny * head;
    return '<path class="arrow" d="M ' + round(tipX) + ' ' + round(tipY) +
      ' L ' + round(baseX + tx * half) + ' ' + round(baseY + ty * half) +
      ' L ' + round(baseX - tx * half) + ' ' + round(baseY - ty * half) + ' Z" fill="' +
      color + '"/>';
  }

  // Номера стоят вплотную к своей линии — с той стороны, где нет стрелки
  // (то есть со стороны здания, а не камеры).
  // Соседние номера не наезжают друг на друга: при нехватке места номер
  // сдвигается вдоль линии, потом чуть дальше от неё.
  var BADGE_R = 23;
  function placeBadges(items) {
    var placed = [];
    var offsets = [42, 42, 42, 58, 76, 96];
    var shifts = [0, -0.28, 0.28, -0.42, 0.42];
    var MIN = -40, MAX = 1040;
    function clamp(v) { return v < MIN ? MIN : (v > MAX ? MAX : v); }
    function clash(px, py) {
      return placed.some(function (p) {
        return Math.sqrt((p[0] - px) * (p[0] - px) + (p[1] - py) * (p[1] - py)) < BADGE_R * 2 + 16;
      });
    }
    return items.map(function (item) {
      var seg = item.segment;
      // Стрелка — со стороны камеры, значит номер — с противоположной.
      var nx = -seg.normal[0];
      var ny = -seg.normal[1];
      var tx = seg.to[0] - seg.from[0];
      var ty = seg.to[1] - seg.from[1];
      var fallback = null;
      for (var i = 0; i < offsets.length; i++) {
        for (var j = 0; j < shifts.length; j++) {
          // Точка на линии (0.5 — середина, ± — вдоль линии), сдвинутая
          // в сторону, противоположную стрелке.
          var t = 0.5 + shifts[j];
          var px = clamp(seg.from[0] + tx * t + nx * offsets[i]);
          var py = clamp(seg.from[1] + ty * t + ny * offsets[i]);
          if (fallback === null) fallback = [px, py];
          if (clash(px, py)) continue;
          placed.push([px, py]);
          return [px, py];
        }
      }
      var spot = fallback || [clamp(seg.from[0]), clamp(seg.from[1])];
      placed.push(spot);
      return spot;
    });
  }

  // Линия фасада с учётом того, что её сейчас тянут мышью.
  function segmentOf(item) {
    if (moving && moving.item === item && moving.segment) return moving.segment;
    return item.segment;
  }

  function planSvg() {
    var cell = 1000 / grid();
    var svg = [];
    svg.push('<svg viewBox="-110 -110 1220 1220" preserveAspectRatio="xMidYMid meet">');
    svg.push('<rect x="-110" y="-110" width="1220" height="1220" fill="#ffffff"/>');

    // Контур здания — ровно тот, что виден сверху внутри открытой группы:
    // все грани одним цветом, без линий и швов.
    var faces = polygons();
    if (faces.length) {
      faces.forEach(function (points) {
        svg.push('<polygon fill="#d6dae1" points="' +
          points.map(function (p) { return round(p[0]) + ',' + round(p[1]); }).join(' ') +
          '"/>');
      });
    } else {
      cells().forEach(function (c) {
        svg.push('<rect x="' + round(c[0] * cell) + '" y="' + round(c[1] * cell) +
          '" width="' + round(cell + 0.5) + '" height="' + round(cell + 0.5) +
          '" fill="#d6dae1"/>');
      });
    }

    var items = visibleItems().filter(function (item) { return item.segment; });
    var badges = placeBadges(items);

    items.forEach(function (item, i) {
      var seg = segmentOf(item);
      var color = item.selected ? '#e03131' : '#b9c1cc';
      var width = item.selected ? 10 : 7;

      // Сама линия фасада — тонкая и ровно там, где её провели.
      svg.push('<line class="wall" x1="' + round(seg.from[0]) + '" y1="' + round(seg.from[1]) +
        '" x2="' + round(seg.to[0]) + '" y2="' + round(seg.to[1]) +
        '" stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round"/>');
      svg.push(arrowMark(seg, color));

      // Номер — снаружи, чтобы не заслонять схему.
      var b = badges[i];
      svg.push('<g class="badge-g" data-index="' + item.position + '">');
      svg.push('<circle cx="' + round(b[0]) + '" cy="' + round(b[1]) + '" r="' + BADGE_R +
        '" fill="' + (item.selected ? color : '#ffffff') + '" stroke="' + color +
        '" stroke-width="3"/>');
      svg.push('<text x="' + round(b[0]) + '" y="' + round(b[1]) + '" text-anchor="middle" ' +
        'dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" ' +
        'font-size="24" font-weight="700" fill="' +
        (item.selected ? '#ffffff' : '#9aa3b0') + '">' + esc(item.index) + '</text>');
      svg.push('</g>');

      // Кликабельная область линии (невидимая, но широкая — для пальца/мыши).
      svg.push('<g class="wall-hit" data-index="' + item.position + '">' +
        '<line x1="' + round(seg.from[0]) + '" y1="' + round(seg.from[1]) +
        '" x2="' + round(seg.to[0]) + '" y2="' + round(seg.to[1]) +
        '" stroke="transparent" stroke-width="80" stroke-linecap="round"/></g>');
    });

    if (drag) svg.push(dragMarks());
    svg.push('</svg>');
    return svg.join('');
  }

  // Магнитные направления основных плоскостей — те же, что считает Ruby.
  function magnetAngles() {
    var list = (data && data.magnets) || [];
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      if (!v) continue;
      var x = Number(v[0]);
      var y = Number(v[1]);
      if (!isFinite(x) || !isFinite(y) || (!x && !y)) continue;
      var a = Math.atan2(y, x) * 180 / Math.PI;
      out.push(a < 0 ? a + 180 : a);     // прямая, направление не важно
    }
    return out;
  }

  // Линия прилипает к главным плоскостям прямо во время протяжки: тот же
  // допуск и тот же поворот вокруг середины, что и в Ruby при отпускании.
  // Так пользователь видит, что магнит сработал, ещё не отпустив кнопку.
  function magnetizeLine(line) {
    var dx = line[2] - line[0];
    var dy = line[3] - line[1];
    var length = Math.sqrt(dx * dx + dy * dy);
    if (length < 1e-6) return { line: line, snapped: false };
    var angle = Math.atan2(dy, dx) * 180 / Math.PI;
    if (angle < 0) angle += 180;
    var best = null;
    var candidates = magnetAngles();
    for (var i = 0; i < candidates.length; i++) {
      var diff = Math.abs(angle - candidates[i]);
      if (diff > 90) diff = 180 - diff;
      if (best === null || diff < best[1]) best = [candidates[i], diff];
    }
    // Допуск магнита — как SNAP_TOL в Ruby.
    var tolerance = Number((data && data.magnetTol) || 14);
    if (!best || best[1] > tolerance) return { line: line, snapped: false };
    var rad = best[0] * Math.PI / 180;
    var ux = Math.cos(rad);
    var uy = Math.sin(rad);
    var mx = (line[0] + line[2]) / 2;
    var my = (line[1] + line[3]) / 2;
    return {
      line: [mx - ux * length / 2, my - uy * length / 2,
             mx + ux * length / 2, my + uy * length / 2],
      snapped: true
    };
  }

  // Нарисованная линия: снаружи — красная, внутри здания — синяя (сечение).
  function dragMarks() { return dragMarksFor(drag); }

  function dragMarksFor(line) {
    if (!line) return '';
    line = magnetizeLine(line).line;
    var steps = 160;
    var parts = [];
    var current = null;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var x = line[0] + (line[2] - line[0]) * t;
      var y = line[1] + (line[3] - line[1]) * t;
      var inside = insideBuilding(x, y);
      if (current === null || current.inside !== inside) {
        if (current) parts.push(current);
        current = { inside: inside, points: [[x, y]] };
      } else {
        current.points.push([x, y]);
      }
    }
    if (current) parts.push(current);
    return parts.map(function (part) {
      var pts = part.points;
      var a = pts[0];
      var b = pts[pts.length - 1];
      return '<line x1="' + round(a[0]) + '" y1="' + round(a[1]) + '" x2="' + round(b[0]) +
        '" y2="' + round(b[1]) + '" stroke="' + (part.inside ? '#1f6feb' : '#e03131') +
        '" stroke-width="' + (part.inside ? 12 : 10) + '" stroke-linecap="round"' +
        ' opacity="0.85"/>';
    }).join('');
  }

  function renderPlan() {
    document.getElementById('canvas').innerHTML = planSvg();
  }

  /* --------------------------------------------------- список фасадов */

  function renderRows() {
    var items = visibleItems();
    if (!items.length) {
      document.getElementById('rows').innerHTML =
        '<div class="empty">Фасадов пока нет. Проведите линию на схеме слева — ' +
        'по ней и пойдёт фасад.</div>';
      updateFootnote();
      return;
    }
    var html = '';
    items.forEach(function (item) {
      html += '<div class="facade' + (item.selected ? '' : ' off') + '"' +
        ' data-position="' + item.position + '" data-index="' + item.index + '">';
      html += '<div><div class="badge" data-role="toggle">' + esc(item.index) + '</div></div>';
      html += '<div><input type="text" data-role="name" maxlength="60" value="' +
        esc(item.name) + '"></div>';
      html += '<div><select data-role="orient">' + options(data && data.orients,
        item.orient) + '</select></div>';
      var orient = item.orient || (data && data.defaultOrient) || 'h';
      var pairs = ratiosFor(orient);
      var locked = pairs.length <= 1;   // «квадрат» — только 1:1
      html += '<div><select data-role="ratio"' + (locked ? ' disabled' : '') +
        ' title="' + (locked ? 'У квадратного кадра пропорция всегда 1:1' :
        'Пропорции для выбранной ориентации') + '">' +
        options(pairs, locked ? pairs[0][0] : fittedRatio(orient, item.ratio)) +
        '</select></div>';
      html += '<div class="px" data-role="px">' + sizeText(item) + '</div>';
      html += '<div><button type="button" class="flip" data-role="flip"' +
        ' title="Развернуть фасад в другую сторону">⇄</button></div>';
      html += '<div><button type="button" class="remove" data-role="remove"' +
        ' title="Убрать фасад">×</button></div>';
      html += '</div>';
    });
    document.getElementById('rows').innerHTML = html;
    updateFootnote();
  }

  function options(list, current) {
    var pairs = list || [];
    var found = pairs.some(function (pair) { return pair[0] === current; });
    return pairs.map(function (pair) {
      return '<option value="' + esc(pair[0]) + '"' +
        (pair[0] === current ? ' selected' : '') + '>' + esc(pair[1]) + '</option>';
    }).join('') + (found || !current ? '' :
      '<option value="' + esc(current) + '" selected>' + esc(current) + '</option>');
  }

  function toggle(position) {
    var item = itemAt(position);
    if (!item) return;
    item.selected = !item.selected;
    renderPlan();
    renderRows();
  }

  // Убрать фасад: нумерацию 1..N считает Ruby, он же сохраняет список
  // в модель и присылает окну готовый набор.
  function removeItem(position) {
    var item = itemAt(position);
    if (!item) return;
    if (window.sketchup && typeof sketchup.delete_facade === 'function') {
      sketchup.delete_facade(JSON.stringify({ id: item.id, index: item.index }));
      return;
    }
    item.removed = true;
    item.selected = false;
    state = visibleItems().map(function (entry, i) { return entry; });
    state.forEach(function (entry, i) { entry.position = i; entry.index = i + 1; });
    renderPlan();
    renderRows();
  }

  // Развернуть фасад: он остаётся на том же месте, но смотрит в другую
  // сторону. Пересчёт делает Ruby (там же пересобирается и камера).
  function invertItem(item) {
    if (!item) return;
    if (window.sketchup && typeof sketchup.invert_facade === 'function') {
      sketchup.invert_facade(JSON.stringify({ id: item.id, index: item.index }));
      return;
    }
    var seg = item.segment;
    if (seg) {
      seg.normal = [-seg.normal[0], -seg.normal[1]];
      renderPlan();
    }
  }

  function updateFootnote() {
    var items = visibleItems();
    var chosen = items.filter(function (s) { return s.selected; }).length;
    var parts = ['Нарисовано: ' + items.length + '.'];
    parts.push('Выбрано: ' + chosen + '.');
    parts.push(data && data.deleteScenes ? 'Сцены временные.' : 'Сцены останутся в модели.');
    document.getElementById('footnote').textContent = parts.join(' ');
  }

  /* ------------------------------------ рисование и перенос линий мышью */

  function svgPoint(event) {
    var svg = document.querySelector('#canvas svg');
    if (!svg) return null;
    var rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) {
      if (!event.clientX) return null;
      rect = { left: 0, top: 0, width: 300, height: 300 };
    }
    var vb = svg.viewBox && svg.viewBox.baseVal ? svg.viewBox.baseVal :
      { x: -110, y: -110, width: 1220, height: 1220 };
    var scale = Math.min(rect.width / vb.width, rect.height / vb.height);
    var offsetX = (rect.width - vb.width * scale) / 2;
    var offsetY = (rect.height - vb.height * scale) / 2;
    return [
      (event.clientX - rect.left - offsetX) / scale + vb.x,
      (event.clientY - rect.top - offsetY) / scale + vb.y
    ];
  }

  // Координаты схемы -> координаты модели (для Ruby).
  function toWorld(point) {
    var span = Number((data && data.span) || 0) || 1;
    var ox = (data && data.origin && Number(data.origin.x)) || 0;
    var oy = (data && data.origin && Number(data.origin.y)) || 0;
    return [ox + point[0] / 1000 * span, oy + (1000 - point[1]) / 1000 * span];
  }

  // Ближайшая линия к точке — её можно тянуть.
  function lineAt(point) {
    var best = null;
    visibleItems().forEach(function (item) {
      if (!item.segment) return;
      var d = distanceToSegment(point, item.segment.from, item.segment.to);
      if (d < 26 && (best === null || d < best.d)) best = { item: item, d: d };
    });
    return best ? best.item : null;
  }

  var startPoint = null;
  var moved = false;
  var lastPoint = null;      // последняя точка протяжки — на случай отпускания вне схемы
  var hoverCursor = '';

  // Курсор «перетащить», когда под мышью линия: видно, что её можно тянуть.
  function setHover(hit) {
    var canvas = document.getElementById('canvas');
    if (!canvas) return;
    var want = hit ? 'draggable' : '';
    if (want === hoverCursor) return;
    hoverCursor = want;
    canvas.classList.toggle('draggable', !!hit);
    canvas.classList.remove('grabbing');
  }

  function beginDraw(event) {
    var point = svgPoint(event);
    if (!point) return;
    var hit = lineAt(point);
    if (hit) {
      // Тянем существующую линию: только перенос, поворачивать нельзя.
      moving = { item: hit, start: point, segment: copySegment(hit.segment), wasMoved: false };
      moved = false;
      lastPoint = point;
      var canvas = document.getElementById('canvas');
      if (canvas) { canvas.classList.add('grabbing'); canvas.classList.remove('draggable'); }
      return;
    }
    startPoint = point;
    moved = false;
    drag = null;
  }

  function copySegment(seg) {
    if (!seg) return null;
    return {
      from: [seg.from[0], seg.from[1]],
      to: [seg.to[0], seg.to[1]],
      normal: [seg.normal[0], seg.normal[1]],
      area: seg.area
    };
  }

  function translateSegment(seg, dx, dy) {
    var copy = copySegment(seg);
    copy.from = [copy.from[0] + dx, copy.from[1] + dy];
    copy.to = [copy.to[0] + dx, copy.to[1] + dy];
    return copy;
  }

  function moveDraw(event) {
    var point = svgPoint(event);
    if (!point) return;
    lastPoint = point;
    if (!moving && !startPoint) { setHover(lineAt(point)); return; }

    if (moving) {
      var mdx = point[0] - moving.start[0];
      var mdy = point[1] - moving.start[1];
      if (!moving.wasMoved && Math.sqrt(mdx * mdx + mdy * mdy) < 6) return;
      moving.wasMoved = true;
      moved = true;
      moving.segment = translateSegment(moving.item.segment, mdx, mdy);
      renderPlan();
      return;
    }

    if (!startPoint) return;
    var dx = point[0] - startPoint[0];
    var dy = point[1] - startPoint[1];
    if (!moved && Math.sqrt(dx * dx + dy * dy) < 18) return;
    moved = true;
    drag = [startPoint[0], startPoint[1], point[0], point[1]];
    renderPlan();
  }

  function endDraw(event) {
    var point = svgPoint(event) || lastPoint;
    var canvas = document.getElementById('canvas');
    if (canvas) canvas.classList.remove('grabbing');

    if (moving) {
      var current = moving;
      moving = null;
      moved = false;
      if (!current.wasMoved) {
        // Клик по линии без движения — включить/выключить фасад.
        toggle(current.item.position);
      } else {
        sendMove(current.item, current.segment);
      }
      renderPlan();
      setHover(point ? lineAt(point) : null);
      return;
    }

    if (!startPoint) return;
    point = point || startPoint;
    var line = drag;
    var wasMoved = moved;
    startPoint = null;
    moved = false;
    drag = null;
    if (!wasMoved) {
      hitTest(point);
      renderPlan();
      return;
    }
    renderPlan();
    if (!line) return;
    // Отпустили кнопку — магнит срабатывает так же, как во время протяжки.
    line = magnetizeLine(line).line;
    sendLine(line);
  }

  // Линия уходит в Ruby: там она притянется к основным плоскостям модели
  // и станет фасадом.
  function sendLine(line) {
    var a = toWorld([line[0], line[1]]);
    var b = toWorld([line[2], line[3]]);
    if (window.sketchup && typeof sketchup.add_facade === 'function') {
      sketchup.add_facade(JSON.stringify({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
    } else {
      showNote('Линия нарисована. В SketchUp она станет фасадом.');
    }
  }

  // Передвинутая линия уходит в Ruby: место новое, направление прежнее.
  function sendMove(item, segment) {
    if (!segment) return;
    var a = toWorld(segment.from);
    var b = toWorld(segment.to);
    if (window.sketchup && typeof sketchup.move_facade === 'function') {
      sketchup.move_facade(JSON.stringify({
        id: item.id, index: item.index,
        x1: a[0], y1: a[1], x2: b[0], y2: b[1]
      }));
    } else {
      item.segment = segment;
      renderPlan();
      showNote('Линия передвинута.');
    }
  }

  // Номер к точке; клик вне их ничего не делает.
  function hitTest(point) {
    var items = visibleItems().filter(function (item) { return item.segment; });
    var hit = lineAt(point);
    if (hit) { toggle(hit.position); return; }
    var badges = placeBadges(items);
    for (var i = 0; i < items.length; i++) {
      var p = badges[i];
      if (Math.sqrt((p[0] - point[0]) * (p[0] - point[0]) +
                    (p[1] - point[1]) * (p[1] - point[1])) < BADGE_R + 12) {
        toggle(items[i].position);
        return;
      }
    }
  }

  function distanceToSegment(p, a, b) {
    var vx = b[0] - a[0];
    var vy = b[1] - a[1];
    var len = vx * vx + vy * vy;
    if (len < 1e-9) {
      return Math.sqrt((p[0] - a[0]) * (p[0] - a[0]) + (p[1] - a[1]) * (p[1] - a[1]));
    }
    var t = ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / len;
    t = Math.max(0, Math.min(1, t));
    var x = a[0] + vx * t;
    var y = a[1] + vy * t;
    return Math.sqrt((p[0] - x) * (p[0] - x) + (p[1] - y) * (p[1] - y));
  }

  function bindCanvas() {
    var canvas = document.getElementById('canvas');

    canvas.addEventListener('click', function (event) {
      var node = event.target;
      var hit = node.closest ? node.closest('.wall-hit, .badge-g') : null;
      if (!hit) return;
      toggle(Number(hit.getAttribute('data-index')));
    });

    canvas.addEventListener('pointerdown', beginDraw);
    canvas.addEventListener('pointermove', moveDraw);
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointercancel', function () {
      startPoint = null;
      moved = false;
      drag = null;
      moving = null;
      lastPoint = null;
      renderPlan();
      setHover(null);
    });

    // Браузеры без Pointer Events.
    canvas.addEventListener('mousedown', function (event) {
      if (!window.PointerEvent) beginDraw(event);
    });
    canvas.addEventListener('mousemove', function (event) {
      if (!window.PointerEvent) moveDraw(event);
    });
    canvas.addEventListener('mouseup', function (event) {
      if (!window.PointerEvent) endDraw(event);
    });
  }

  function bindRows() {
    var rows = document.getElementById('rows');

    rows.addEventListener('click', function (event) {
      var row = event.target.closest ? event.target.closest('.facade') : null;
      if (!row) return;
      var position = Number(row.getAttribute('data-position'));
      var role = event.target.getAttribute('data-role');
      if (role === 'remove') { removeItem(position); return; }
      if (role === 'flip') { invertItem(itemAt(position)); return; }
      if (role === 'toggle') { toggle(position); return; }
      if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT') return;
      toggle(position);
    });

    rows.addEventListener('input', function (event) {
      var row = event.target.closest ? event.target.closest('.facade') : null;
      if (!row || event.target.getAttribute('data-role') !== 'name') return;
      var item = itemAt(Number(row.getAttribute('data-position')));
      if (item) item.name = event.target.value;
    });

    rows.addEventListener('change', function (event) {
      var row = event.target.closest ? event.target.closest('.facade') : null;
      if (!row) return;
      var role = event.target.getAttribute('data-role');
      if (role !== 'orient' && role !== 'ratio') return;
      var item = itemAt(Number(row.getAttribute('data-position')));
      if (!item) return;
      if (role === 'orient') {
        // Списки не пересекаются: при смене ориентации берём первую
        // пропорцию новой ориентации (у «квадрата» она единственная).
        item.orient = event.target.value;
        item.ratio = defaultRatio(item.orient);
        renderRows();
        renderPlan();
        return;
      }
      item.ratio = event.target.value;
      row.querySelector('[data-role="px"]').textContent = sizeText(item);
    });
  }

  function showNote(text) {
    var node = document.getElementById('footnote');
    if (node) node.textContent = text;
  }

  /* -------------------------------------------------------- API для Ruby */

  function makeItem(f, position) {
    return {
      position: position,
      id: f.id,
      index: f.index,
      selected: f.selected !== false,
      removed: false,
      name: f.name || ('Фасад ' + f.index),
      orient: f.orient || (data && data.defaultOrient) || 'h',
      ratio: f.ratio || defaultRatio(f.orient || (data && data.defaultOrient) || 'h'),
      flip: f.flip === true,
      segment: f.segment || null
    };
  }

  function setData(json) {
    try {
      data = JSON.parse(json);
    } catch (e) {
      data = null;
    }
    if (!data) return;
    state = (data.facades || []).map(makeItem);
    var count = state.length;
    var subtitle = 'Фасадов нарисовано: ' + count + ' — ' +
      (data.scope === 'context' ? 'открытая группа' : 'вся модель') + '. ';
    subtitle += count
      ? 'Тяните линию, чтобы передвинуть её; «⇄» разворачивает фасад.'
      : 'Проведите линию на схеме — по ней и пойдёт фасад.';
    document.getElementById('subtitle').textContent = subtitle;
    renderPlan();
    renderRows();
  }

  // Ruby развернул или передвинул фасад: обновляем ту же строку.
  function updateFacade(json) {
    var payload = null;
    try {
      payload = JSON.parse(json);
    } catch (e) {
      payload = null;
    }
    if (!payload || payload.ok !== true) {
      showNote((payload && payload.message) || 'Не удалось изменить фасад.');
      return;
    }
    var item = null;
    for (var i = 0; i < state.length; i++) {
      if (payload.id !== undefined && payload.id !== null &&
          String(state[i].id) === String(payload.id)) { item = state[i]; break; }
    }
    if (!item) {
      for (var j = 0; j < state.length; j++) {
        if (state[j].index === payload.index) { item = state[j]; break; }
      }
    }
    if (!item) return;
    if (payload.index) item.index = payload.index;
    if (payload.name) item.name = payload.name;
    if (payload.orient) item.orient = payload.orient;
    if (payload.ratio) item.ratio = payload.ratio;
    if (payload.flip !== undefined && payload.flip !== null) item.flip = payload.flip === true;
    if (payload.segment) item.segment = payload.segment;
    renderPlan();
    renderRows();
    showNote('Фасад ' + item.index + ' обновлён.');
  }

  function addFacade(json) {
    var payload = null;
    try {
      payload = JSON.parse(json);
    } catch (e) {
      payload = null;
    }
    if (!payload) return;
    if (payload.ok !== true) {
      showNote(payload.message || 'Не удалось создать фасад по этой линии.');
      return;
    }
    var item = makeItem(payload, state.length);
    item.selected = true;
    state.push(item);
    renderPlan();
    renderRows();
    showNote('Фасад ' + item.index + ' добавлен.');
  }

  window.FacadeExportAuto = {
    setData: setData, addFacade: addFacade, updateFacade: updateFacade
  };
  // Отладочные точки входа для автотестов окна (jsdom).
  window.FacadeExportAuto._state = function () { return state; };
  window.FacadeExportAuto._draw = function (x1, y1, x2, y2) {
    sendLine([x1, y1, x2, y2]);
  };
  window.FacadeExportAuto._move = function (index, dx, dy) {
    var item = state[index];
    if (!item || !item.segment) return;
    sendMove(item, translateSegment(item.segment, dx, dy));
  };
  window.FacadeExportAuto._debug = {
    insideBuilding: insideBuilding,
    toWorld: toWorld,
    dragMarks: function (line) { return dragMarksFor(line); },
    placeBadges: placeBadges,
    magnetize: function (line) { return magnetizeLine(line); },
    setHover: setHover,
    pixels: pixels
  };

  function inSketchUp() {
    return !!(window.sketchup && typeof sketchup.ready === 'function' &&
      typeof sketchup.export === 'function');
  }

  function collect() {
    return {
      facades: visibleItems().map(function (item) {
        return {
          id: item.id,
          index: item.index,
          selected: !!item.selected,
          name: item.name,
          orient: item.orient,
          ratio: item.ratio
        };
      })
    };
  }

  document.addEventListener('DOMContentLoaded', function () {
    bindCanvas();
    bindRows();

    document.getElementById('btn-export').addEventListener('click', function () {
      if (!visibleItems().some(function (s) { return s.selected; })) {
        showNote('Нарисуйте хотя бы один фасад.');
        return;
      }
      if (inSketchUp()) sketchup.export(JSON.stringify(collect()));
      else window.close();
    });
    document.getElementById('btn-cancel').addEventListener('click', function () {
      if (inSketchUp()) sketchup.cancel();
      else window.close();
    });

    if (inSketchUp()) {
      sketchup.ready();
    } else if (window.FACADE_EXPORT_AUTO_DEMO) {
      setData(JSON.stringify(window.FACADE_EXPORT_AUTO_DEMO));
      document.getElementById('btn-export').textContent = 'Экспортировать (демо)';
    }
  });
})();
</script>
</body>
</html>
