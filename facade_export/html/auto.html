<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экспорт фасадов — автоматический вывод</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #dcdfe4;
    --text: #23272e;
    --muted: #6b7280;
    --accent: #1f6feb;
    --accent-dark: #1857bd;
    --wall: #e03131;
    --wall-off: #b9c1cc;
    --cut: #1f6feb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    flex: 0 0 auto;
    padding: 10px 16px 9px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 2px 0; font-size: 15px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }

  main {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: 12px; align-items: stretch;
    padding: 10px 16px 12px 16px;
  }

  /* Слева — схема здания сверху. */
  .plan-pane {
    flex: 0 0 auto; width: 46%; min-width: 280px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px;
  }
  .plan-pane .canvas { flex: 1 1 auto; min-height: 0; position: relative; }
  .plan-pane .canvas svg {
    width: 100%; height: 100%; display: block;
    touch-action: none; cursor: crosshair;
  }
  .plan-pane .caption { font-size: 11px; color: var(--muted); text-align: center; }

  /* Справа — компактный список фасадов. */
  .list-pane {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden;
  }
  .list-pane .head, .facade {
    display: grid;
    grid-template-columns: 30px minmax(70px, 1fr) 96px 74px 22px 22px;
    gap: 6px; align-items: center;
  }
  .list-pane .head {
    padding: 6px 10px; border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--muted);
  }
  .list-pane .rows { flex: 1 1 auto; overflow-y: auto; }

  .facade { padding: 5px 10px; border-bottom: 1px solid #eef0f3; }
  .facade.off { opacity: .5; }
  .badge {
    width: 20px; height: 20px; line-height: 16px; border-radius: 10px;
    text-align: center; font-size: 11px; font-weight: 600;
    border: 2px solid var(--wall); background: var(--wall); color: #fff;
    cursor: pointer;
  }
  .facade.off .badge { border-color: var(--wall-off); background: #fff; color: var(--muted); }
  input[type="text"], select {
    font: inherit; padding: 3px 6px; border: 1px solid var(--line);
    border-radius: 5px; background: #fff; color: var(--text); width: 100%;
  }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }
  .px { color: var(--muted); font-size: 11px; text-align: right; }
  .remove, .flip {
    border: 0; background: transparent; color: var(--muted); font-size: 14px;
    cursor: pointer; padding: 0; line-height: 1;
  }
  .remove:hover { color: #c0392b; }
  .flip:hover { color: var(--accent); }

  footer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line);
  }
  footer .spacer { flex: 1 1 auto; }
  footer .hint { max-width: 620px; color: var(--muted); font-size: 11.5px; }
  footer button {
    padding: 6px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--text); font: inherit; cursor: pointer;
  }
  footer button:hover { background: #f0f2f5; }
  footer button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  footer button.primary:hover { background: var(--accent-dark); }
</style>
</head>
<body>

<header>
  <h1>Автоматический вывод фасада</h1>
  <p id="subtitle">Анализ модели…</p>
</header>

<main>
  <section class="plan-pane">
    <div class="canvas" id="canvas"></div>
    <div class="caption">Клик по стене — включить/выключить. Проведите линию —
      по ней и пойдёт фасад; синий участок = сечение внутри здания.</div>
  </section>
  <section class="list-pane">
    <div class="head">
      <div>№</div><div>Имя фасада</div><div>Стороны</div><div>Размер</div>
      <div title="Развернуть фасад">⇄</div><div></div>
    </div>
    <div class="rows" id="rows"></div>
  </section>
</main>

<footer>
  <span class="hint" id="footnote"></span>
  <span class="spacer"></span>
  <button id="btn-cancel" type="button">Отмена</button>
  <button id="btn-export" class="primary" type="button">Экспортировать</button>
</footer>

<script>
(function () {
  "use strict";

  var data = null;
  var state = [];        // фасады окна, порядок = порядок строк
  var drag = null;       // [x1, y1, x2, y2] — текущая линия на схеме

  /* ------------------------------------------------------------ утилиты */

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function round(v) { return Math.round(v); }

  function grid() { return Number((data && data.plan && data.plan.grid) || 40); }
  function cells() { return (data && data.plan && data.plan.cells) || []; }
  function polygons() { return (data && data.plan && data.plan.polygons) || []; }

  // Точка внутри многоугольника (алгоритм луча).
  function inPolygon(x, y, points) {
    var inside = false;
    var j = points.length - 1;
    for (var i = 0; i < points.length; i++) {
      var xi = points[i][0], yi = points[i][1];
      var xj = points[j][0], yj = points[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
        inside = !inside;
      }
      j = i;
    }
    return inside;
  }

  // Размер PNG по соотношению: длинная сторона — из настроек экспорта.
  function pixels(aspect, longest) {
    if (!aspect || aspect === 'авто') return null;
    var parts = String(aspect).split(':');
    var a = Number(parts[0]) || 1;
    var b = Number(parts[1]) || 1;
    if (a >= b) return [longest, Math.max(100, round(longest * b / a))];
    return [Math.max(100, round(longest * a / b)), longest];
  }

  function sizeText(aspect) {
    var px = pixels(aspect, (data && data.longestSide) || 9999);
    return px ? (px[0] + '×' + px[1]) : 'по фасаду';
  }

  function itemAt(position) { return state[position]; }

  function visibleItems() {
    return state.filter(function (item) { return !item.removed; });
  }

  /* ------------------------------------------------ схема сверху «жучок» */

  // Точка внутри контура здания (по клеткам схемы, ось Y перевёрнута).
  function insideBuilding(x, y) {
    var faces = polygons();
    if (faces.length) {
      for (var i = 0; i < faces.length; i++) {
        if (inPolygon(x, y, faces[i])) return true;
      }
      return false;
    }
    var cell = 1000 / grid();
    var ix = Math.floor(x / cell);
    var iy = Math.floor(y / cell);
    var list = cells();
    for (var i = 0; i < list.length; i++) {
      if (list[i][0] === ix && list[i][1] === iy) return true;
    }
    return false;
  }

  // Стрелка — просто треугольник снаружи стены: угол показывает, в какую
  // сторону обращён фасад (то есть откуда на него смотрит камера).
  function arrowMark(cx, cy, nx, ny, color) {
    var base = 42;      // отступ от стены до основания треугольника
    var head = 30;      // высота треугольника
    var half = 14;      // половина основания
    var tx = -ny;
    var ty = nx;
    var tipX = cx + nx * (base + head);
    var tipY = cy + ny * (base + head);
    var baseX = cx + nx * base;
    var baseY = cy + ny * base;
    return '<path d="M ' + round(tipX) + ' ' + round(tipY) +
      ' L ' + round(baseX + tx * half) + ' ' + round(baseY + ty * half) +
      ' L ' + round(baseX - tx * half) + ' ' + round(baseY - ty * half) + ' Z" fill="' +
      color + '"/>';
  }

  // Номера расставляются снаружи контура, не наезжая друг на друга и не
  // попадая на само здание: иначе не понять, какой номер к какой стене.
  function placeBadges(items) {
    var placed = [];
    var rings = [140, 190, 240, 290, 340];
    var shifts = [0, 60, -60, 120, -120, 180, -180];
    var MIN = -60, MAX = 1060;
    function clamp(v) { return v < MIN ? MIN : (v > MAX ? MAX : v); }
    function clash(px, py) {
      return placed.some(function (p) {
        return Math.sqrt((p[0] - px) * (p[0] - px) + (p[1] - py) * (p[1] - py)) < 48;
      });
    }
    return items.map(function (item) {
      var seg = item.segment;
      var cx = (seg.from[0] + seg.to[0]) / 2;
      var cy = (seg.from[1] + seg.to[1]) / 2;
      var nx = seg.normal[0];
      var ny = seg.normal[1];
      var tx = -ny;
      var ty = nx;
      var free = null;
      var anywhere = null;
      for (var r = 0; r < rings.length && free === null; r++) {
        for (var s = 0; s < shifts.length; s++) {
          var px = clamp(cx + nx * rings[r] + tx * shifts[s]);
          var py = clamp(cy + ny * rings[r] + ty * shifts[s]);
          if (anywhere === null) anywhere = [px, py];
          if (insideBuilding(px, py) || clash(px, py)) continue;
          free = [px, py];
          break;
        }
      }
      var spot = free || anywhere || [clamp(cx + nx * 140), clamp(cy + ny * 140)];
      placed.push(spot);
      return spot;
    });
  }

  function planSvg() {
    var cell = 1000 / grid();
    var svg = [];
    svg.push('<svg viewBox="-110 -110 1220 1220" preserveAspectRatio="xMidYMid meet">');
    svg.push('<rect x="-110" y="-110" width="1220" height="1220" fill="#ffffff"/>');

    // Контур здания — ровно тот, что виден сверху внутри открытой группы:
    // все грани одним цветом, без линий и швов.
    var faces = polygons();
    if (faces.length) {
      faces.forEach(function (points) {
        var list = points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
        svg.push('<polygon points="' + list + '" fill="#d6dae1"/>');
      });
    } else {
      cells().forEach(function (c) {
        svg.push('<rect x="' + round(c[0] * cell) + '" y="' + round(c[1] * cell) +
          '" width="' + round(cell + 0.5) + '" height="' + round(cell + 0.5) +
          '" fill="#d6dae1"/>');
      });
    }

    var items = visibleItems().filter(function (item) { return item.segment; });
    var badges = placeBadges(items);

    items.forEach(function (item, i) {
      var seg = item.segment;
      var color = item.selected ? '#e03131' : '#b9c1cc';
      var width = item.selected ? 22 : 14;
      var cx = (seg.from[0] + seg.to[0]) / 2;
      var cy = (seg.from[1] + seg.to[1]) / 2;

      // Номер вне схемы, чтобы не заслонять контур.
      var b = badges[i];
      svg.push('<g class="badge-g" data-index="' + item.position + '">');
      svg.push('<circle cx="' + round(b[0]) + '" cy="' + round(b[1]) + '" r="16" fill="' +
        (item.selected ? color : '#ffffff') + '" stroke="' + color + '" stroke-width="4"/>');
      svg.push('<text x="' + round(b[0]) + '" y="' + round(b[1]) + '" text-anchor="middle" ' +
        'dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" ' +
        'font-size="18" font-weight="600" fill="' +
        (item.selected ? '#ffffff' : '#9aa3b0') + '">' + esc(item.index) + '</text>');
      svg.push('</g>');

      // Сама стена.
      svg.push('<line x1="' + round(seg.from[0]) + '" y1="' + round(seg.from[1]) +
        '" x2="' + round(seg.to[0]) + '" y2="' + round(seg.to[1]) +
        '" stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round"/>');
      svg.push(arrowMark(cx, cy, seg.normal[0], seg.normal[1], color));

      // Кликабельная область стены (невидимая, широкая).
      svg.push('<g class="wall-hit" data-index="' + item.position + '">' +
        '<line x1="' + round(seg.from[0]) + '" y1="' + round(seg.from[1]) +
        '" x2="' + round(seg.to[0]) + '" y2="' + round(seg.to[1]) +
        '" stroke="transparent" stroke-width="80" stroke-linecap="round"/>' +
        '<line x1="' + round(seg.from[0]) + '" y1="' + round(seg.from[1]) +
        '" x2="' + round(seg.to[0]) + '" y2="' + round(seg.to[1]) +
        '" stroke="transparent" stroke-width="22"/></g>');
    });

    if (drag) svg.push(dragMarks());
    svg.push('</svg>');
    return svg.join('');
  }

  // Нарисованная линия: снаружи — красная, внутри здания — синяя (сечение).
  function dragMarks() { return dragMarksFor(drag); }

  function dragMarksFor(line) {
    if (!line) return '';
    var steps = 160;
    var parts = [];
    var current = null;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var x = line[0] + (line[2] - line[0]) * t;
      var y = line[1] + (line[3] - line[1]) * t;
      var inside = insideBuilding(x, y);
      if (current === null || current.inside !== inside) {
        if (current) parts.push(current);
        current = { inside: inside, points: [[x, y]] };
      } else {
        current.points.push([x, y]);
      }
    }
    if (current) parts.push(current);
    return parts.map(function (part) {
      var pts = part.points;
      var a = pts[0];
      var b = pts[pts.length - 1];
      return '<line x1="' + round(a[0]) + '" y1="' + round(a[1]) + '" x2="' + round(b[0]) +
        '" y2="' + round(b[1]) + '" stroke="' + (part.inside ? '#1f6feb' : '#e03131') +
        '" stroke-width="' + (part.inside ? 16 : 12) + '" stroke-linecap="round"' +
        ' opacity="0.85"/>';
    }).join('');
  }

  function renderPlan() {
    document.getElementById('canvas').innerHTML = planSvg();
  }

  /* --------------------------------------------------- список фасадов */

  function renderRows() {
    var html = '';
    visibleItems().forEach(function (item) {
      html += '<div class="facade' + (item.selected ? '' : ' off') + '"' +
        ' data-position="' + item.position + '" data-index="' + item.index + '">';
      html += '<div><div class="badge" data-role="toggle">' + esc(item.index) + '</div></div>';
      html += '<div><input type="text" data-role="name" maxlength="60" value="' +
        esc(item.name) + '"></div>';
      html += '<div><select data-role="aspect">' + aspectOptions(item.aspect) + '</select></div>';
      html += '<div class="px" data-role="px">' + sizeText(item.aspect) + '</div>';
      html += '<div><button type="button" class="flip" data-role="flip"' +
        ' title="Развернуть фасад в другую сторону">⇄</button></div>';
      html += '<div><button type="button" class="remove" data-role="remove"' +
        ' title="Убрать фасад">×</button></div>';
      html += '</div>';
    });
    document.getElementById('rows').innerHTML = html;
    updateFootnote();
  }

  function aspectOptions(current) {
    var list = (data && data.aspects) || [];
    var found = list.some(function (pair) { return pair[0] === current; });
    return list.map(function (pair) {
      return '<option value="' + esc(pair[0]) + '"' +
        (pair[0] === current ? ' selected' : '') + '>' + esc(pair[1]) + '</option>';
    }).join('') + (found ? '' :
      '<option value="' + esc(current) + '" selected>' + esc(current) + '</option>');
  }

  function toggle(position) {
    var item = itemAt(position);
    if (!item) return;
    item.selected = !item.selected;
    renderPlan();
    renderRows();
  }

  function removeItem(position) {
    var item = itemAt(position);
    if (!item) return;
    item.removed = true;
    item.selected = false;
    renderPlan();
    renderRows();
  }

  // Развернуть фасад: он остаётся на том же месте, но смотрит в другую
  // сторону. Пересчёт делает Ruby (там же пересобирается и камера).
  function invertItem(item) {
    if (!item) return;
    if (window.sketchup && typeof sketchup.invert_facade === 'function') {
      sketchup.invert_facade(JSON.stringify({ index: item.index }));
      return;
    }
    var seg = item.segment;
    if (seg) {
      seg.normal = [-seg.normal[0], -seg.normal[1]];
      renderPlan();
    }
  }

  function updateFootnote() {
    var items = visibleItems();
    var chosen = items.filter(function (s) { return s.selected; }).length;
    var parts = ['Выбрано: ' + chosen + ' из ' + items.length + '.'];
    parts.push(data && data.deleteScenes ? 'Сцены временные.' : 'Сцены останутся в модели.');
    document.getElementById('footnote').textContent = parts.join(' ');
  }

  /* ------------------------------------ рисование линии на схеме мышью */

  function svgPoint(event) {
    var svg = document.querySelector('#canvas svg');
    if (!svg) return null;
    var rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) {
      if (!event.clientX) return null;
      rect = { left: 0, top: 0, width: 300, height: 300 };
    }
    var vb = svg.viewBox && svg.viewBox.baseVal ? svg.viewBox.baseVal :
      { x: -40, y: -40, width: 1080, height: 1080 };
    var scale = Math.min(rect.width / vb.width, rect.height / vb.height);
    var offsetX = (rect.width - vb.width * scale) / 2;
    var offsetY = (rect.height - vb.height * scale) / 2;
    return [
      (event.clientX - rect.left - offsetX) / scale + vb.x,
      (event.clientY - rect.top - offsetY) / scale + vb.y
    ];
  }

  // Координаты схемы -> координаты модели (для Ruby).
  function toWorld(point) {
    var span = Number((data && data.span) || 0) || 1;
    var ox = (data && data.origin && Number(data.origin.x)) || 0;
    var oy = (data && data.origin && Number(data.origin.y)) || 0;
    return [ox + point[0] / 1000 * span, oy + (1000 - point[1]) / 1000 * span];
  }

  // Общая точка: клик по стене или по номеру.
  var startPoint = null;
  var moved = false;

  function beginDraw(event) {
    var point = svgPoint(event);
    if (!point) return;
    startPoint = point;
    moved = false;
    drag = null;
  }

  function moveDraw(event) {
    if (!startPoint) return;
    var point = svgPoint(event);
    if (!point) return;
    var dx = point[0] - startPoint[0];
    var dy = point[1] - startPoint[1];
    if (!moved && Math.sqrt(dx * dx + dy * dy) < 18) return;
    moved = true;
    drag = [startPoint[0], startPoint[1], point[0], point[1]];
    renderPlan();
  }

  function endDraw(event) {
    if (!startPoint) return;
    var point = svgPoint(event) || startPoint;
    var line = drag;
    var wasMoved = moved;
    startPoint = null;
    moved = false;
    drag = null;
    if (!wasMoved) {
      // По стене и номеру клик обрабатывается отдельно (иначе двойное
      // переключение: и здесь, и в обработчике click).
      var onWall = event.target && event.target.closest &&
        event.target.closest('.wall-hit, .badge-g');
      if (!onWall) hitTest(point);
      renderPlan();
      return;
    }
    renderPlan();
    if (!line) return;
    sendLine(line);
  }

  // Линия уходит в Ruby: там она притянется к стене и станет фасадом.
  function sendLine(line) {
    var a = toWorld([line[0], line[1]]);
    var b = toWorld([line[2], line[3]]);
    if (window.sketchup && typeof sketchup.add_facade === 'function') {
      sketchup.add_facade(JSON.stringify({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
    } else {
      showNote('Линия нарисована. В SketchUp она станет фасадом.');
    }
  }

  // Ближайшая стена или номер к точке; клик вне их ничего не делает.
  function hitTest(point) {
    var best = null;
    var items = visibleItems().filter(function (item) { return item.segment; });
    items.forEach(function (item) {
      var seg = item.segment;
      var d = distanceToSegment(point, seg.from, seg.to);
      if (d < 40 && (best === null || d < best.d)) best = { item: item, d: d };
    });
    if (best) { toggle(best.item.position); return; }
    var badges = placeBadges(items);
    for (var i = 0; i < items.length; i++) {
      var p = badges[i];
      if (Math.sqrt((p[0] - point[0]) * (p[0] - point[0]) +
                    (p[1] - point[1]) * (p[1] - point[1])) < 44) {
        toggle(items[i].position);
        return;
      }
    }
  }

  function distanceToSegment(p, a, b) {
    var vx = b[0] - a[0];
    var vy = b[1] - a[1];
    var len = vx * vx + vy * vy;
    if (len < 1e-9) {
      return Math.sqrt((p[0] - a[0]) * (p[0] - a[0]) + (p[1] - a[1]) * (p[1] - a[1]));
    }
    var t = ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / len;
    t = Math.max(0, Math.min(1, t));
    var x = a[0] + vx * t;
    var y = a[1] + vy * t;
    return Math.sqrt((p[0] - x) * (p[0] - x) + (p[1] - y) * (p[1] - y));
  }

  function bindCanvas() {
    var canvas = document.getElementById('canvas');

    canvas.addEventListener('click', function (event) {
      var node = event.target;
      var hit = node.closest ? node.closest('.wall-hit, .badge-g') : null;
      if (!hit) return;
      toggle(Number(hit.getAttribute('data-index')));
    });

    canvas.addEventListener('pointerdown', beginDraw);
    canvas.addEventListener('pointermove', moveDraw);
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointercancel', function () {
      startPoint = null;
      moved = false;
      drag = null;
      renderPlan();
    });

    // Браузеры без Pointer Events.
    canvas.addEventListener('mousedown', function (event) {
      if (!window.PointerEvent) beginDraw(event);
    });
    canvas.addEventListener('mousemove', function (event) {
      if (!window.PointerEvent) moveDraw(event);
    });
    canvas.addEventListener('mouseup', function (event) {
      if (!window.PointerEvent) endDraw(event);
    });
  }

  function bindRows() {
    var rows = document.getElementById('rows');

    rows.addEventListener('click', function (event) {
      var row = event.target.closest ? event.target.closest('.facade') : null;
      if (!row) return;
      var position = Number(row.getAttribute('data-position'));
      var role = event.target.getAttribute('data-role');
      if (role === 'remove') { removeItem(position); return; }
      if (role === 'flip') { invertItem(itemAt(position)); return; }
      if (role === 'toggle') { toggle(position); return; }
      if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT') return;
      toggle(position);
    });

    rows.addEventListener('input', function (event) {
      var row = event.target.closest ? event.target.closest('.facade') : null;
      if (!row || event.target.getAttribute('data-role') !== 'name') return;
      var item = itemAt(Number(row.getAttribute('data-position')));
      if (item) item.name = event.target.value;
    });

    rows.addEventListener('change', function (event) {
      var row = event.target.closest ? event.target.closest('.facade') : null;
      if (!row || event.target.getAttribute('data-role') !== 'aspect') return;
      var item = itemAt(Number(row.getAttribute('data-position')));
      if (!item) return;
      item.aspect = event.target.value;
      row.querySelector('[data-role="px"]').textContent = sizeText(item.aspect);
    });
  }

  function showNote(text) {
    var node = document.getElementById('footnote');
    if (node) node.textContent = text;
  }

  /* -------------------------------------------------------- API для Ruby */

  function setData(json) {
    try {
      data = JSON.parse(json);
    } catch (e) {
      data = null;
    }
    if (!data) return;
    state = (data.facades || []).map(function (f, position) {
      return {
        position: position,
        index: f.index,
        selected: f.selected === true,
        removed: false,
        name: f.name || ('Фасад ' + f.index),
        aspect: f.aspect || data.defaultAspect || 'авто',
        segment: f.segment || null
      };
    });
    document.getElementById('subtitle').textContent =
      'Фасадов: ' + state.length + ' — ' +
      (data.scope === 'context' ? 'открытая группа' : 'вся модель') +
      '. Клик по стене включает и выключает, линия мышью добавляет свой,' +
      ' «⇄» разворачивает фасад в другую сторону.';
    renderPlan();
    renderRows();
  }

  // Ruby развернул фасад: обновляем ту же строку, место на схеме не меняем.
  function updateFacade(json) {
    var payload = null;
    try {
      payload = JSON.parse(json);
    } catch (e) {
      payload = null;
    }
    if (!payload || payload.ok !== true) {
      showNote((payload && payload.message) || 'Не удалось развернуть фасад.');
      return;
    }
    var item = null;
    for (var i = 0; i < state.length; i++) {
      if (state[i].index === payload.index) { item = state[i]; break; }
    }
    if (!item) return;
    if (payload.name) item.name = payload.name;
    if (payload.aspect) item.aspect = payload.aspect;
    if (payload.segment) item.segment = payload.segment;
    renderPlan();
    renderRows();
    showNote('Фасад ' + payload.index + ' развёрнут.');
  }

  function addFacade(json) {
    var payload = null;
    try {
      payload = JSON.parse(json);
    } catch (e) {
      payload = null;
    }
    if (!payload) return;
    if (payload.ok !== true) {
      showNote(payload.message || 'Здесь стена не найдена.');
      return;
    }
    state.push({
      position: state.length,
      index: payload.index,
      selected: true,
      removed: false,
      drawn: payload.drawn === true,
      cut: payload.cut === true,
      name: payload.name || ('Фасад ' + payload.index),
      aspect: payload.aspect || (data && data.defaultAspect) || 'авто',
      segment: payload.segment || null
    });
    renderPlan();
    renderRows();
    showNote('Фасад ' + payload.index + ' добавлен.');
  }

  window.FacadeExportAuto = {
    setData: setData, addFacade: addFacade, updateFacade: updateFacade
  };
  // Отладочные точки входа для автотестов окна (jsdom).
  window.FacadeExportAuto._state = function () { return state; };
  window.FacadeExportAuto._draw = function (x1, y1, x2, y2) {
    sendLine([x1, y1, x2, y2]);
  };
  window.FacadeExportAuto._debug = {
    insideBuilding: insideBuilding,
    toWorld: toWorld,
    dragMarks: function (line) { return dragMarksFor(line); },
    placeBadges: placeBadges
  };

  function inSketchUp() {
    return !!(window.sketchup && typeof sketchup.ready === 'function' &&
      typeof sketchup.export === 'function');
  }

  function collect() {
    return {
      facades: visibleItems().map(function (item) {
        return {
          index: item.index,
          selected: !!item.selected,
          name: item.name,
          aspect: item.aspect
        };
      })
    };
  }

  document.addEventListener('DOMContentLoaded', function () {
    bindCanvas();
    bindRows();

    document.getElementById('btn-export').addEventListener('click', function () {
      if (!visibleItems().some(function (s) { return s.selected; })) {
        showNote('Отметьте хотя бы один фасад.');
        return;
      }
      if (inSketchUp()) sketchup.export(JSON.stringify(collect()));
      else window.close();
    });
    document.getElementById('btn-cancel').addEventListener('click', function () {
      if (inSketchUp()) sketchup.cancel();
      else window.close();
    });

    if (inSketchUp()) {
      sketchup.ready();
    } else if (window.FACADE_EXPORT_AUTO_DEMO) {
      setData(JSON.stringify(window.FACADE_EXPORT_AUTO_DEMO));
      document.getElementById('btn-export').textContent = 'Экспортировать (демо)';
    }
  });
})();
</script>
</body>
</html>
